schema_version: 1

http:
  listen: "127.0.0.1:8080"

data:
  database: "./data/agent.db"
  workspace_root: "./data/workspaces"
  log_dir: "./data/logs"
  retention_days: 7

redmine:
  base_url: "https://redmine.internal"
  api_key: "env:REDMINE_API_KEY"
  comment_on_finish: true
  update_status: false

gitlab:
  base_url: "https://gitlab.internal"
  token: "env:GITLAB_TOKEN"
  push_enabled: true
  merge_request_enabled: true

# `repository_path` is either a GitLab project path ("group/project") or an
# absolute directory on this machine ("/srv/repos/billing"). When every mapping
# is a local directory the whole `gitlab` section may be omitted: the worker
# clones from the path and never contacts a GitLab server. Set push_enabled to
# have the dedicated branch pushed back into that local repository; merge
# requests are always skipped for local paths.
repositories:
  - redmine_project: "billing"
    repository_path: "group/billing-api"
    base_branch: "main"
    is_default: true
    checks:
      - name: "unit-tests"
        command_linux: "go test ./..."
        command_windows: "go test ./..."
        required: true
        timeout_seconds: 900
      - name: "lint"
        command_linux: "golangci-lint run"
        command_windows: "golangci-lint run"
        required: false

agent:
  adapter: "opencode"
  model: "opencode-go/deepseek-v4.1-flash"
  profile: "build"                 # must name an installed agent (opencode debug agents)
  # Containment knobs. The defaults are the strict ones:
  #   sandbox_home: true        the agent gets a run-scoped HOME/XDG tree and
  #                             cannot read your CLI config or stored credentials
  #   env_passthrough: []       nothing extra is forwarded to the agent process
  # A provider that authenticates through your user profile, or a corporate
  # proxy, needs both relaxed deliberately:
  # sandbox_home: false
  # env_passthrough: ["HTTPS_PROXY", "HTTP_PROXY", "NO_PROXY"]
  timeout_minutes: 45
  max_repairs: 1

concurrency:
  max_active_runs: 1

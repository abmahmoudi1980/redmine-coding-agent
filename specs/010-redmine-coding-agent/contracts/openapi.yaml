openapi: 3.1.0
info:
  title: RedmineCodingAgent Worker API
  version: 1.0.0
  summary: Local operator API for previewing a Redmine issue and driving one automated implementation run.
  description: |
    Bound to loopback by default (`http.listen`). No per-user authentication in v1 (see the specification's
    Assumptions); deploy behind network-level access control.

    All timestamps are UTC RFC 3339 with milliseconds. All durations are integer milliseconds.
    Error responses use `application/problem+json` (RFC 9457) and never echo credential values.

    Identifiers: `runId` is a UUIDv7. `issueId` is the Redmine issue number (positive integer).
  contact:
    name: Internal engineering
servers:
  - url: http://127.0.0.1:8080
    description: Default loopback listener

tags:
  - name: meta
  - name: issues
  - name: runs
  - name: events
  - name: health

paths:
  /api/meta:
    get:
      tags: [meta]
      operationId: getMeta
      summary: Build and runtime identity
      responses:
        '200':
          description: Version, commit, build date, OS/arch, and schema version.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Meta' }

  /api/config:
    get:
      tags: [meta]
      operationId: getEffectiveConfig
      summary: Effective non-secret configuration
      description: |
        Returns the resolved configuration with every secret replaced by its reference
        (`env:NAME` / `file:/path`). This is the same redacted document persisted to
        `configuration_profiles`, so operators can diff a past run's profile against today's settings.
      responses:
        '200':
          description: Redacted configuration and its content hash.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EffectiveConfig' }

  /api/health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Worker and dependency health
      description: |
        Probes the orchestrator (database writable, migrations current) and, when `?deep=true`,
        Redmine, GitLab, the configured repository, and the coding agent (FR-058).
        Probes run with a short timeout; a failing dependency is reported, not thrown.
      parameters:
        - name: deep
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Overall status is `ok` or `degraded`. `503` is never returned so the UI can render partial failure.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthReport' }

  /api/repositories:
    get:
      tags: [issues]
      operationId: listRepositories
      summary: Configured project-to-repository mappings
      parameters:
        - name: project
          in: query
          description: Filter by Redmine project identifier.
          schema: { type: string }
      responses:
        '200':
          description: Mappings with their validation checks and publishing policy.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Repository' }

  /api/issues/{issueId}/preview:
    get:
      tags: [issues]
      operationId: previewIssue
      summary: Retrieve an issue and resolve its repository without creating a run
      description: |
        Implements US1. Performs no workspace, git, or agent action. Returns the issue snapshot,
        the resolved repository, and the base branch. When the project maps to more than one
        repository and no default is configured, returns `409 repository_ambiguous` with the
        candidate list — the caller must resubmit with `repositoryId`.
      parameters:
        - $ref: '#/components/parameters/IssueId'
        - name: repositoryId
          in: query
          description: Explicit choice for a multi-repository project (FR-015).
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Issue retrieved and destination resolved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssuePreview' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/IssueNotFound'
        '409':
          $ref: '#/components/responses/RepositoryAmbiguous'
        '502':
          $ref: '#/components/responses/UpstreamFailure'

  /api/runs:
    post:
      tags: [runs]
      operationId: createRun
      summary: Start a run for a confirmed issue
      description: |
        The body carries the confirmation: the operator has seen the issue, repository, and base
        branch. `confirm` must be `true` (FR-008) — this endpoint is the only way a run starts.

        Rejections (all leave the store untouched):
        - `409 active_run_exists` when a non-terminal run already exists for the issue; the body
          carries that run's `runId` and `stage` (FR-010).
        - `429 concurrency_limit` when the configured active-run limit is reached (FR-011).
        - `409 repository_ambiguous` when the mapping is still ambiguous (FR-015).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRunRequest' }
            examples:
              minimal:
                value: { issueId: 4821, confirm: true }
              explicitRepository:
                value: { issueId: 4821, repositoryId: 3, confirm: true }
      responses:
        '201':
          description: Run created and queued.
          headers:
            Location:
              schema: { type: string }
              description: '/api/runs/{runId}'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: An active run exists, or the repository mapping is ambiguous.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429':
          $ref: '#/components/responses/ConcurrencyLimit'
        '502':
          $ref: '#/components/responses/UpstreamFailure'

    get:
      tags: [runs]
      operationId: listRuns
      summary: Run history
      description: Newest first by `createdAt`, cursor-paginated. Survives restarts (FR-049).
      parameters:
        - name: state
          in: query
          schema: { $ref: '#/components/schemas/RunState' }
        - name: issueId
          in: query
          schema: { type: integer, minimum: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: cursor
          in: query
          description: Opaque cursor from a previous page's `nextCursor`.
          schema: { type: string }
      responses:
        '200':
          description: A page of runs.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunPage' }

  /api/runs/{runId}:
    get:
      tags: [runs]
      operationId: getRun
      summary: Full run detail
      description: |
        Everything the operator needs to decide what happened: state, stage, elapsed time,
        workspace facts, agent invocations, per-check results, commit, merge request, and the report.
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Run detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunDetail' }
        '404':
          $ref: '#/components/responses/RunNotFound'

  /api/runs/{runId}/cancel:
    post:
      tags: [runs]
      operationId: cancelRun
      summary: Cancel an active run
      description: |
        Requests cancellation and returns immediately; the stream reports the outcome.
        The agent process tree is terminated, logs are kept, and the run reaches `cancelled`.
        Nothing is pushed or published after cancellation begins (FR-012, FR-013, SC-009).
        Idempotent: cancelling an already-cancelled run returns `200`; cancelling a terminal run
        returns `409 run_not_cancellable`.
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '202':
          description: Cancellation accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '404':
          $ref: '#/components/responses/RunNotFound'
        '409':
          $ref: '#/components/responses/NotCancellable'

  /api/runs/{runId}/retry:
    post:
      tags: [runs]
      operationId: retryRun
      summary: Retry an issue as a new, linked attempt
      description: |
        Creates a new run with `previousRunId` set and a branch suffixed with the attempt number
        when the previous branch still exists remotely (FR-052). A prior attempt is never
        force-pushed over. Rejected with `409` while the previous run is still active.
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '201':
          description: New run created and linked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '404':
          $ref: '#/components/responses/RunNotFound'
        '409':
          $ref: '#/components/responses/NotCancellable'

  /api/runs/{runId}/checks:
    get:
      tags: [runs]
      operationId: listRunChecks
      summary: Validation results for every attempt
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Check results grouped by invocation attempt.
          content:
            application/json:
              schema:
                type: object
                required: [attempts]
                properties:
                  attempts:
                    type: array
                    items: { $ref: '#/components/schemas/CheckAttempt' }

  /api/runs/{runId}/report:
    get:
      tags: [runs]
      operationId: getRunReport
      summary: Final report and its delivery state
      description: Returns the rendered markdown even when Redmine delivery failed (FR-047).
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Report, or `null` when the run has not reached reporting.
          content:
            application/json:
              schema:
                type: object
                properties:
                  report:
                    oneOf:
                      - { $ref: '#/components/schemas/Report' }
                      - { type: 'null' }
        '404':
          $ref: '#/components/responses/RunNotFound'

  /api/runs/{runId}/logs:
    get:
      tags: [runs]
      operationId: getRunLogs
      summary: Tail a run's log file
      parameters:
        - $ref: '#/components/parameters/RunId'
        - name: tail
          in: query
          schema: { type: integer, minimum: 1, maximum: 5000, default: 500 }
      responses:
        '200':
          description: Log lines, oldest first, already redacted.
          content:
            application/json:
              schema:
                type: object
                required: [lines]
                properties:
                  lines:
                    type: array
                    items: { type: string }
        '404':
          $ref: '#/components/responses/RunNotFound'
        '410':
          description: Log file was pruned. The timeline in `run_events` may still be available.

  /api/runs/{runId}/events:
    get:
      tags: [events]
      operationId: streamRunEvents
      summary: Server-Sent Events stream for one run
      description: |
        `text/event-stream`. One stream per open run view.

        **Resumption**: each event's `id` is the run's monotonic `seq`. On reconnect the browser
        sends `Last-Event-ID`; the server replays every event with a greater `seq` before
        switching to live delivery. A `: heartbeat` comment is sent every 15 s.

        **Event grammar**

        ```
        id: <seq>
        event: state | stage | activity | check | agent | workspace | publish | report | warning | error | heartbeat
        data: <JSON, see SseEvent.data>
        ```

        The stream closes after the terminal event (`state` to `completed`, `failed`, `blocked`,
        `cancelled`, or `interrupted`). A client that reconnects to a finished run receives the
        replay and an immediate close, which is the intended behaviour for page reloads.

        **Caveat**: browsers limit concurrent HTTP/1.1 connections per origin; with many run views
        open at once, prefer one stream for the visible run.
      parameters:
        - $ref: '#/components/parameters/RunId'
        - name: Last-Event-ID
          in: header
          required: false
          description: Last `seq` the client received; replay starts strictly after it.
          schema: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Event stream.
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                id: 41
                event: stage
                data: {"stage":"agent.invoked:1","at":"2026-10-26T09:41:07.123Z"}

                id: 42
                event: activity
                data: {"message":"Reading src/orders/service.go","severity":"info"}
        '404':
          $ref: '#/components/responses/RunNotFound'

components:
  parameters:
    IssueId:
      name: issueId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    RunId:
      name: runId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: The request is malformed or failed validation (no upstream call was made).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            invalidIssueId:
              value:
                type: https://redmine-agent.local/problems/invalid_issue_id
                title: Invalid issue number
                status: 400
                code: invalid_issue_id
                detail: The issue number must be a positive integer.
    IssueNotFound:
      description: The issue does not exist or the configured credential cannot read it (FR-005).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            notFound:
              value:
                type: https://redmine-agent.local/problems/issue_not_found
                title: Issue not available
                status: 404
                code: issue_not_found
                detail: 'Issue 4821 was not found, or is not visible to the configured Redmine credential.'
    RepositoryAmbiguous:
      description: The project maps to several repositories and no default is configured (FR-015).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            ambiguous:
              value:
                type: https://redmine-agent.local/problems/repository_ambiguous
                title: Repository selection required
                status: 409
                code: repository_ambiguous
                detail: 'Project "billing" maps to 2 repositories; choose one explicitly.'
                candidates:
                  - { repositoryId: 3, path: group/billing-api, baseBranch: main }
                  - { repositoryId: 4, path: group/billing-ui, baseBranch: develop }
    UpstreamFailure:
      description: Redmine, GitLab, the repository, or the agent could not be reached.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            gitlab:
              value:
                type: https://redmine-agent.local/problems/connectivity_gitlab
                title: GitLab unreachable
                status: 502
                code: connectivity_gitlab
                detail: 'GitLab at gitlab.internal did not respond within 10s. Check the VPN path.'
                stage: connectivity.gitlab
    ConcurrencyLimit:
      description: The configured limit of active runs is reached (FR-011).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RunNotFound:
      description: No run with that id.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotCancellable:
      description: The run is already terminal, or another attempt is still active.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Meta:
      type: object
      required: [version, commit, builtAt, os, arch, schemaVersion]
      properties:
        version: { type: string, example: 0.1.0 }
        commit: { type: string }
        builtAt: { type: string, format: date-time }
        os: { type: string, enum: [linux, windows] }
        arch: { type: string, enum: [amd64, arm64] }
        schemaVersion: { type: integer, example: 1 }

    Problem:
      type: object
      required: [type, title, status, code, detail]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string, description: Already redacted; safe to display and log. }
        stage: { type: string }
        candidates:
          type: array
          items: { $ref: '#/components/schemas/RepositoryOption' }
        activeRun:
          type: object
          description: Present on `active_run_exists` so the operator can jump to the blocking run.
          properties:
            runId: { type: string, format: uuid }
            stage: { type: string }
            state: { $ref: '#/components/schemas/RunState' }

    EffectiveConfig:
      type: object
      required: [schemaVersion, contentHash, loadedAt, redacted]
      properties:
        schemaVersion: { type: integer }
        contentHash: { type: string }
        loadedAt: { type: string, format: date-time }
        redacted: { type: object, additionalProperties: true }

    HealthReport:
      type: object
      required: [status, checkedAt, components]
      properties:
        status: { type: string, enum: [ok, degraded] }
        checkedAt: { type: string, format: date-time }
        components:
          type: array
          items:
            type: object
            required: [name, status]
            properties:
              name: { type: string, enum: [database, redmine, gitlab, repository, agent, disk] }
              status: { type: string, enum: [ok, failing, unknown] }
              latencyMs: { type: integer }
              detail: { type: string, description: Redacted explanation when failing. }
              remediation: { type: string, description: Actionable next step (FR-017). }

    RepositoryOption:
      type: object
      required: [repositoryId, path, baseBranch]
      properties:
        repositoryId: { type: integer }
        path: { type: string, example: group/sub/project }
        displayName: { type: string }
        baseBranch: { type: string }
        isDefault: { type: boolean }

    Repository:
      allOf:
        - $ref: '#/components/schemas/RepositoryOption'
        - type: object
          required: [redmineProject, enabled, publishEnabled, mergeRequestEnabled, checks]
          properties:
            redmineProject: { type: string }
            enabled: { type: boolean }
            publishEnabled: { type: boolean }
            mergeRequestEnabled: { type: boolean }
            checks:
              type: array
              items: { $ref: '#/components/schemas/CheckDefinition' }

    CheckDefinition:
      type: object
      required: [name, required, timeoutSeconds, position]
      properties:
        name: { type: string, example: unit-tests }
        command:
          type: string
          description: Rendered for the host OS; read-only here.
          example: go test ./...
        required: { type: boolean }
        timeoutSeconds: { type: integer }
        position: { type: integer }

    IssuePreview:
      type: object
      required: [issue, repository, baseBranch, startedAt]
      properties:
        issue: { $ref: '#/components/schemas/IssueSnapshot' }
        repository: { $ref: '#/components/schemas/RepositoryOption' }
        baseBranch: { type: string }
        warnings:
          type: array
          description: Non-blocking advisories, e.g. `no_acceptance_criteria` or `attachments_unavailable`.
          items: { type: string }
        candidates:
          type: array
          description: Present when a choice is still required; otherwise empty.
          items: { $ref: '#/components/schemas/RepositoryOption' }

    IssueSnapshot:
      type: object
      required: [issueId, subject, description, project, fetchedAt]
      properties:
        issueId: { type: integer }
        subject: { type: string }
        description: { type: string }
        acceptanceCriteria: { type: string }
        criteriaSource: { type: string, enum: [heading, none] }
        project:
          type: object
          required: [identifier, name]
          properties:
            identifier: { type: string }
            name: { type: string }
        status: { type: string }
        tracker: { type: string }
        priority: { type: string }
        assignee: { type: string }
        parentIssueId: { type: integer }
        relatedIssueIds:
          type: array
          items: { type: integer }
        customFields:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              value: { type: string }
        comments:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              author: { type: string }
              createdOn: { type: string, format: date-time }
              notes: { type: string }
        attachments:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              filename: { type: string }
              size: { type: integer }
              available: { type: boolean, description: false when it could not be retrieved (FR-007). }
        contentHash: { type: string }
        fetchedAt: { type: string, format: date-time }

    CreateRunRequest:
      type: object
      required: [issueId, confirm]
      properties:
        issueId: { type: integer, minimum: 1 }
        repositoryId: { type: integer, minimum: 1 }
        confirm:
          type: boolean
          const: true
          description: Explicit confirmation of the displayed issue, repository, and base branch (FR-008).
        commentIds:
          type: array
          description: Optional narrowing of which journal entries travel to the agent.
          items: { type: integer }

    RunState:
      type: string
      enum: [queued, preparing, implementing, validating, repairing, publishing, reporting, completed, failed, blocked, cancelled, interrupted]

    TerminalState:
      type: string
      enum: [completed, failed, blocked, cancelled, interrupted]

    FailureCode:
      type: string
      enum:
        - issue_not_found
        - issue_inaccessible
        - issue_input_invalid
        - no_repository_mapping
        - repository_ambiguous
        - config_invalid
        - connectivity_redmine
        - connectivity_gitlab
        - connectivity_repository
        - agent_unavailable
        - workspace_failed
        - agent_error
        - agent_timeout
        - agent_blocked
        - policy_violation
        - no_changes
        - validation_failed
        - no_checks_configured
        - push_rejected
        - merge_request_failed
        - cancelled
        - interrupted

    Run:
      type: object
      required: [runId, issueId, state, stage, createdAt]
      properties:
        runId: { type: string, format: uuid }
        issueId: { type: integer }
        issueSubject: { type: string }
        previousRunId: { type: string, format: uuid, nullable: true }
        attemptNo:
          type: integer
          minimum: 1
          description: 1 for the original attempt; increases along the retry chain (FR-052).
        state: { $ref: '#/components/schemas/RunState' }
        stage: { type: string }
        terminal: { type: boolean }
        repository:
          oneOf:
            - { $ref: '#/components/schemas/RepositoryOption' }
            - { type: 'null' }
        baseBranch: { type: string }
        baseRevision: { type: string }
        branch: { type: string }
        commitSha: { type: string, nullable: true }
        pushedAt: { type: string, format: date-time, nullable: true }
        mergeRequestUrl: { type: string, format: uri, nullable: true }
        agent:
          type: object
          properties:
            name: { type: string }
            model: { type: string }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, nullable: true }
        endedAt: { type: string, format: date-time, nullable: true }
        elapsedMs: { type: integer, description: Server-computed; clients should tick locally from startedAt. }
        cancelRequestedAt: { type: string, format: date-time, nullable: true }
        interruptedStage:
          type: string
          description: The stage the run had reached when startup recovery interrupted it (FR-051).
        failureCode: { $ref: '#/components/schemas/FailureCode' }
        failureMessage: { type: string }
        failureStage:
          type: string
          description: The stage at which the run failed, rendered so a failure is diagnosable without logs (SC-011).
        failureRemediation:
          type: string
          description: Actionable next step for the failure code (FR-017).
        summary: { type: string }

    RunDetail:
      allOf:
        - $ref: '#/components/schemas/Run'
        - type: object
          properties:
            issue: { $ref: '#/components/schemas/IssueSnapshot' }
            workspace:
              oneOf:
                - $ref: '#/components/schemas/Workspace'
                - { type: 'null' }
            invocations:
              type: array
              items: { $ref: '#/components/schemas/AgentInvocation' }
            checks:
              type: array
              items: { $ref: '#/components/schemas/ValidationResult' }
            report:
              oneOf:
                - $ref: '#/components/schemas/Report'
                - { type: 'null' }
            configProfileHash: { type: string }
            timeline:
              type: array
              description: Most recent 200 events, oldest first. Use the SSE stream for live updates.
              items: { $ref: '#/components/schemas/RunEvent' }

    Workspace:
      type: object
      required: [branch, baseRevision, createdAt, hasUnpushedChanges]
      properties:
        path: { type: string }
        branch: { type: string }
        baseRevision: { type: string }
        createdAt: { type: string, format: date-time }
        cleanedAt: { type: string, format: date-time, nullable: true }
        hasUnpushedChanges: { type: boolean }
        changedPaths:
          type: array
          items: { type: string }

    AgentInvocation:
      type: object
      required: [attemptNo, kind, adapter, model, status]
      properties:
        attemptNo: { type: integer, minimum: 1 }
        kind: { type: string, enum: [implement, repair] }
        adapter: { type: string, example: opencode }
        model: { type: string, example: anthropic/claude-sonnet-4 }
        status: { type: string, enum: [running, succeeded, failed, timed_out, cancelled, blocked] }
        reportedStatus:
          type: string
          nullable: true
          description: The agent's own claim. Never used to decide pass/fail (FR-025).
        exitCode: { type: integer, nullable: true }
        timedOut: { type: boolean }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time, nullable: true }
        durationMs: { type: integer }
        promptSha256: { type: string }
        transcriptAvailable: { type: boolean }

    ValidationResult:
      type: object
      required: [checkName, command, required, outcome]
      properties:
        checkName: { type: string }
        command: { type: string }
        required: { type: boolean }
        outcome: { type: string, enum: [passed, failed, not_executed] }
        exitCode: { type: integer, nullable: true }
        durationMs: { type: integer }
        reason:
          type: string
          description: Required when outcome is `not_executed` (timeout, cancelled, not_configured).
        outputExcerpt: { type: string, description: Last 64 KiB, redacted. }

    CheckAttempt:
      type: object
      required: [attemptNo, invocationStatus, results]
      properties:
        attemptNo: { type: integer }
        invocationStatus: { type: string }
        results:
          type: array
          items: { $ref: '#/components/schemas/ValidationResult' }
        allRequiredPassed: { type: boolean }
        repairPrompted: { type: boolean }

    Report:
      type: object
      required: [bodyMarkdown, deliveryStatus, dedupeKey]
      properties:
        bodyMarkdown: { type: string }
        commitSha: { type: string, nullable: true }
        mergeRequestUrl: { type: string, format: uri, nullable: true }
        deliveryStatus: { type: string, enum: [pending, delivered, failed, skipped] }
        deliveryError: { type: string, nullable: true }
        dedupeKey: { type: string }
        createdAt: { type: string, format: date-time }
        deliveredAt: { type: string, format: date-time, nullable: true }

    RunEvent:
      type: object
      required: [seq, at, type, severity, message]
      properties:
        seq: { type: integer, minimum: 1 }
        at: { type: string, format: date-time }
        type:
          type: string
          enum: [state, stage, activity, check, agent, workspace, publish, report, warning, error]
        severity: { type: string, enum: [info, warn, error] }
        message: { type: string }
        data:
          type: object
          additionalProperties: true
          description: Event-specific payload. Never contains secrets.

    SseEvent:
      type: object
      description: |
        Shape of the `data:` payload per SSE `event:` name. `state` events are terminal markers
        when the value is one of the terminal states.
      properties:
        at: { type: string, format: date-time }
        message: { type: string }
        stage: { type: string }
        state: { $ref: '#/components/schemas/RunState' }
        severity: { type: string, enum: [info, warn, error] }
        check:
          $ref: '#/components/schemas/ValidationResult'

    RunPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Run' }
        nextCursor:
          type: string
          nullable: true

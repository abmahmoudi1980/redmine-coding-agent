name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: go vet
        run: go vet ./cmd/... ./internal/... ./tests/...

      - name: go test
        run: go test ./cmd/... ./internal/... ./tests/... -count=1

      - name: go test -race
        if: runner.os == 'Linux'
        run: go test -race ./cmd/... ./internal/... ./tests/... -count=1

      - name: svelte-check
        working-directory: web
        run: npm run check

      - name: vitest
        working-directory: web
        run: npm test

      - name: cross-compile all release targets
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cross"
          for target in linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            out="$RUNNER_TEMP/cross/redmine-agent-$goos-$goarch"
            if [ "$goos" = "windows" ]; then
              out="$out.exe"
            fi
            echo "building $goos/$goarch"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -trimpath -o "$out" ./cmd/redmine-agent
          done

      - name: go build (host)
        run: CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/redmine-agent" ./cmd/redmine-agent
